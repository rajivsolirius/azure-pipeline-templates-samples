---
parameters:
  - name: terraform_action
    default: 'apply'

  - name: serviceConnection

  - name: root_module_folder_relative_path
    default: '.'

  # Subscription in which Terraform should manage resources.
  #
  # This is deliberately separate from the subscription associated
  # with the Azure DevOps Service Connection.
  - name: targetSubscriptionId
    type: string
    default: ''

steps:
  - task: AzureCLI@2
    displayName: Terraform Plan for ${{ coalesce(parameters.terraform_action, 'Apply') }}

    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      addSpnToEnvironment: true

      inlineScript: |

        # ---------------------------------------------------------
        # Authentication information comes from the Azure DevOps
        # Service Connection.
        # ---------------------------------------------------------

        az account show 2>$null |
          ConvertFrom-Json |
          Set-Variable account

        $clientId  = $account.user.name
        $oidcToken = $env:idToken
        $tenantId  = $account.tenantId

        # ---------------------------------------------------------
        # Target subscription is deliberately independent of the
        # Service Connection subscription.
        #
        # If no explicit target was supplied, retain the original
        # ALZ behaviour and use the Service Connection subscription.
        # ---------------------------------------------------------

        if ([string]::IsNullOrWhiteSpace($env:TARGET_SUBSCRIPTION_ID)) {
            $subscriptionId = $account.id
        }
        else {
            $subscriptionId = $env:TARGET_SUBSCRIPTION_ID
        }

        Write-Host "Terraform authentication client ID : $clientId"
        Write-Host "Terraform tenant ID                : $tenantId"
        Write-Host "Terraform target subscription      : $subscriptionId"

        # ---------------------------------------------------------
        # Terraform Azure authentication
        # ---------------------------------------------------------

        $env:ARM_TENANT_ID       = $tenantId
        $env:ARM_SUBSCRIPTION_ID = $subscriptionId
        $env:ARM_OIDC_TOKEN      = $oidcToken
        $env:ARM_USE_OIDC        = "true"
        $env:ARM_CLIENT_ID       = $clientId
        $env:ARM_USE_AZUREAD     = "true"

        # Also make the subscription available to Terraform as:
        #
        # var.subscription_id
        #
        # This means your current provider configuration:
        #
        # provider "azurerm" {
        #   features {}
        #   subscription_id = var.subscription_id
        # }
        #
        # will continue to work.
        $env:TF_VAR_subscription_id = $subscriptionId

        # ---------------------------------------------------------
        # Terraform Plan
        # ---------------------------------------------------------

        $command = "terraform"

        $arguments = @()

        $arguments += "-chdir=${{ parameters.root_module_folder_relative_path }}"
        $arguments += "plan"
        $arguments += "-out=tfplan"
        $arguments += "-input=false"

        if ($env:TERRAFORM_ACTION -eq 'destroy') {
            $arguments += "-destroy"
        }

        Write-Host "Running: $command $arguments"

        & $command $arguments

        if ($LASTEXITCODE -ne 0) {
            throw "Terraform plan failed with exit code $LASTEXITCODE"
        }

    env:
      TERRAFORM_ACTION: ${{ coalesce(parameters.terraform_action, 'apply') }}
      TARGET_SUBSCRIPTION_ID: ${{ parameters.targetSubscriptionId }}